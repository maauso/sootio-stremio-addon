name: Publish fork image

on:
  push:
    branches:
      - deploy/**
    paths:
      - "lib/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/publish-fork-image.yml"
  workflow_dispatch:

concurrency:
  group: publish-fork-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Jackett resolver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The upstream npm test script invokes the shell wrapper through Node and
      # does not enable ESM support, so run the focused suite explicitly.
      - name: Run resolver tests
        run: >-
          node --experimental-vm-modules
          node_modules/jest/bin/jest.js
          --runInBand
          tests/jackett-torrent-resolver.test.js

  publish:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Published image tags
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
